name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  audit:
    name: cask-audit
    runs-on: macos-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Tap checked out repository
        run: brew tap --custom-remote monkescience/tap "$GITHUB_WORKSPACE"

      - name: Audit tap casks
        env:
          HOMEBREW_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          brew audit \
            --strict \
            --online \
            --display-filename \
            --os all \
            --arch all \
            --cask \
            --git \
            --except token_conflicts \
            --tap monkescience/tap
